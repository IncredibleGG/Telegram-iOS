name: iOS Build

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    # Upstream 13.0 pins Xcode 26.6 (versions.json). Only the macos-26 image ships it
    # (macos-15 tops out at 26.3). arm64 is also required by the wasi-sdk toolchain.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -euo pipefail
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app || true
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "Requested Xcode: $XCODE_VERSION"
          XCODE_APP=""
          for candidate in "/Applications/Xcode_$XCODE_VERSION.app" "/Applications/Xcode_$XCODE_VERSION.0.app"; do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            # Fail hard. Silently falling back to the image default only fails later in
            # BuildEnvironment.py (version mismatch) or, worse, builds with the wrong SDK.
            echo "::error::Requested Xcode $XCODE_VERSION is not installed on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          # Same check BuildEnvironment.py performs: CFBundleShortVersionString of the selected Xcode.
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$(xcode-select -p)/../Info.plist")
          if [ "$ACTUAL_VERSION" != "$XCODE_VERSION" ]; then
            echo "::error::Selected $XCODE_APP reports version $ACTUAL_VERSION, expected $XCODE_VERSION"
            exit 1
          fi
          xcodebuild -version
          df -h / || true

      - name: Prepare Metal toolchain
        # Since Xcode 26 the Metal toolchain is an optional component that lives in a cryptex DMG
        # whose mount does not survive a reboot. A fresh runner VM remounts it lazily, which races
        # when bazel starts many MetalCompile actions at once: random shaders die with "cannot
        # execute tool 'metal' due to missing Metal Toolchain" (upstream 4794457664 hit this in
        # 2 of 8 builds; they fixed it only in TartBuild.py). Mirror that fix here: mount once,
        # serially, before bazel runs; download the component if the image lacks it; and fail
        # hard if the tools still do not run, instead of dying halfway through a 2h build.
        timeout-minutes: 30
        run: |
          set -uo pipefail
          mount_metal_toolchain() {
            if [ ! -d /Volumes/MetalToolchainCryptex ]; then
              METAL_DMG="$(ls -t /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/*.asset/AssetData/Restore/*.dmg 2>/dev/null | head -n 1 || true)"
              if [ -n "$METAL_DMG" ]; then
                echo "Mounting $METAL_DMG"
                hdiutil attach "$METAL_DMG" -mountpoint /Volumes/MetalToolchainCryptex -nobrowse -quiet \
                  || sudo hdiutil attach "$METAL_DMG" -mountpoint /Volumes/MetalToolchainCryptex -nobrowse -quiet \
                  || true
              fi
            fi
            # Once mounted, xcrun resolves metallib/air-lld inside the cryptex, but `metal` itself is
            # shadowed by a stub in XcodeDefault.xctoolchain that only prints the error above, so point
            # that one name at the real compiler (same as upstream TartBuild.py).
            METAL_REAL=/Volumes/MetalToolchainCryptex/Metal.xctoolchain/usr/bin/metal
            if [ -x "$METAL_REAL" ] && ! xcrun metal --version >/dev/null 2>&1; then
              sudo ln -sf "$METAL_REAL" "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal" || true
            fi
          }
          metal_ok() {
            xcrun metal --version && xcrun -f metallib
          }
          xcodebuild -showComponent MetalToolchain || true
          mount_metal_toolchain
          if ! metal_ok; then
            echo "Metal toolchain not usable yet; downloading the MetalToolchain component"
            xcodebuild -downloadComponent MetalToolchain || true
            mount_metal_toolchain
          fi
          if ! metal_ok; then
            echo "::error::Metal toolchain is not usable (xcrun metal / xcrun -f metallib failed); shader targets would fail mid-build"
            exit 1
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa (bazel-bin is the canonical symlink; the opt-config
          # directory name under bazel-out is not stable, so glob missed it)
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          if [ -f bazel-bin/Telegram/Telegram.ipa ]; then
            cp bazel-bin/Telegram/Telegram.ipa "$OUTPUT_PATH/"
          else
            cp "$(find -L bazel-out -type f -name Telegram.ipa -path '*/bin/Telegram/*' | head -1)" "$OUTPUT_PATH/"
          fi
          ls -la "$OUTPUT_PATH/"

          # collect dsym (best-effort)
          mkdir -p build/DSYMs
          cp -R bazel-bin/Telegram/*.dSYM build/DSYMs/ 2>/dev/null || true
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null 2>&1 || true

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGram-iOS-unsigned
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error

